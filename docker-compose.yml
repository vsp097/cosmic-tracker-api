services:
  db:
    image: postgres:16
    container_name: cosmic-db
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: cosmic_tracker
    ports:
      - "5433:5432"
    volumes:
      - cosmic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cosmic_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cosmic_pgdata:
